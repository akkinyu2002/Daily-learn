<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Login Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1a0033, #2d0052, #1a0033, #0d001a);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating orbs background effect */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #6b46c1, #a78bfa);
            top: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #3b82f6, #60a5fa);
            bottom: -150px;
            right: -150px;
            animation: float 12s ease-in-out infinite reverse;
        }

        .orb3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ec4899, #f472b6);
            top: 50%;
            right: 5%;
            animation: float 14s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(30px) translateX(20px); }
        }

        /* Sparkle particles */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Login container */
        .login-container {
            position: relative;
            width: 400px;
            padding: 60px 40px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2),
                        0 0 40px rgba(139, 92, 246, 0.1);
            animation: slideUp 0.8s ease-out;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .magic-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .magic-title h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 0px rgba(139, 92, 246, 0), 0 0 10px rgba(139, 92, 246, 0); }
            50% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.5), 0 0 30px rgba(96, 165, 250, 0.3); }
        }

        .magic-title p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(167, 139, 250, 0.9);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3),
                        inset 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .remember-forgot label {
            margin: 0;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .remember-forgot input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #a78bfa;
        }

        .remember-forgot a {
            color: rgba(167, 139, 250, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .remember-forgot a:hover {
            color: #a78bfa;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(139, 92, 246, 0.6),
                        0 0 20px rgba(96, 165, 250, 0.4);
        }

        .login-btn:hover:before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .signup-link a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #60a5fa;
        }

        /* Magic particles that follow cursor */
        .cursor-magic {
            position: fixed;
            width: 10px;
            height: 10px;
            border: 1px solid rgba(167, 139, 250, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFade 1s ease-out forwards;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.8), transparent);
        }

        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Glow effect on hover */
        .form-group:focus-within::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .login-container {
                width: 100%;
                margin: 20px;
            }

            .magic-title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Background orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- Main login container -->
    <div class="login-container">
        <div class="magic-title">
            <h1>✨ Arcane Portal ✨</h1>
            <p>Enter the Enchanted Realm</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Wizard Name</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Enter your mystical username..."
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Spell Incantation</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your secret spell..."
                    required
                >
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#forgotten">Forgotten incantation?</a>
            </div>

            <button type="submit" class="login-btn">Cast the Login Spell</button>
        </form>

        <div class="signup-link">
            Don't have a mystical account? <a href="#signup">Join the Coven</a>
        </div>
    </div>

    <script>
        // Generate random sparkles in the background
        function createSparkles() {
            const sparklesCount = 50;
            for (let i = 0; i < sparklesCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * window.innerWidth + 'px';
                sparkle.style.top = Math.random() * window.innerHeight + 'px';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(sparkle);
            }
        }

        // Create magical particles on cursor movement
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.8) {
                const particle = document.createElement('div');
                particle.className = 'cursor-magic';
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        });

        // Form submission with magic effect
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Create explosion of sparkles on login attempt
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'cursor-magic';
                particle.style.left = window.innerWidth / 2 + 'px';
                particle.style.top = window.innerHeight / 2 + 'px';
                const angle = (Math.PI * 2 * i) / 20;
                const distance = Math.random() * 200 + 100;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }

            // Validate credentials
            if (username && password) {
                alert(`✨ Welcome, ${username}! \n\nThe magical portal accepts your spell. You have entered the enchanted realm!`);
                form.reset();
            }
        });

        // Initialize sparkles on page load
        window.addEventListener('load', createSparkles);

        // Add glow effect to inputs on focus
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.animation = 'none';
                setTimeout(() => {
                    this.parentElement.style.animation = '';
                }, 10);
            });
        });
    </script>
</body>
</html>
